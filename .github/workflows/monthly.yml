name: Monthly validation

on:
  schedule:
    - cron: "48 2 1 * *"
  workflow_dispatch:

concurrency:
  group: monthly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validation:
    uses: ./.github/workflows/ci.yml
    with:
      platforms: true
  security:
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: WireCatLabs/cli-base/.github/workflows/release-checks.yml@583ed8a9c891be6cd57811ac881e9491fe92c5cc # v0.118.0
    with:
      dependencies: true
      languages: '["actions","javascript-typescript"]'
